[package]
name = "otd"
version = "6.0.0"
edition = "2021"
description = "OTD6.0 — Open Three-Dimensional Language. Pure Rust + assembly, zero external libraries: aerodynamics, fluid dynamics, electrodynamics, stellar dynamics, rigid body dynamics, multi-part assembly (include), magnetize, strict-overlap mode, plus the full OTD3 base (thermo, magnetism, waves, energy, Standard Model, PerceptAudio, AVC video, OTD-Burn)."
license = "MIT"

# THE CONSTRAINT: zero external crates. The engine, renderer, PNG encoder,
# HTTP server, JSON, Base64 — everything is written from nothing.
[dependencies]

[lib]
name = "otd"
path = "src/lib.rs"

[[bin]]
name = "otd"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
