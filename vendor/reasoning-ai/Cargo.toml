[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/symbolic",
    "crates/tensor",
    "crates/tokenizer",
    "crates/verifier",
    "crates/search",
    "crates/science",
    "crates/puzzles",
    "crates/memory",
    "crates/uncertainty",
    "crates/prm",
    "crates/neural",
    "crates/curriculum",
    "crates/nlp",
    "crates/rl",
    "crates/selfplay",
    "crates/engine",
    "crates/evaluation",
    "crates/app",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
regex = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
