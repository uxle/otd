[package]
name = "reasoning-uncertainty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reasoning AI — uncertainty crate (Rust port of the Python reasoning-ai project)"

[dependencies]
reasoning-common = { path = "../common" }
reasoning-search = { path = "../search" }
reasoning-prm = { path = "../prm" }

[dev-dependencies]
# test-only deps (mirrors the verifier crate's dev-dep pattern): the ported
# Python tests train a PRM (rand) and re-verify answers (verifier).
rand = { workspace = true }
reasoning-verifier = { path = "../verifier" }
