[package]
name = "reasoning-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reasoning AI — CLI application (Rust port of the Python reasoning-ai project)"
default-run = "reasoning-ai"

[[bin]]
name = "reasoning-ai"
path = "src/main.rs"

[dependencies]
reasoning-engine = { path = "../engine" }
reasoning-selfplay = { path = "../selfplay" }
reasoning-rl = { path = "../rl" }
reasoning-curriculum = { path = "../curriculum" }
reasoning-search = { path = "../search" }
serde_json = { workspace = true }
rand = { workspace = true }
