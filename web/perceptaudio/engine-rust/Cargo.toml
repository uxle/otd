[package]
name = "percept-engine"
version = "2.0.0"
edition = "2021"
description = "PerceptAudio 2.0 — Rust/WASM voice-perception DSP engine (VAD, YIN pitch, distance, speaker clustering, spectral denoising, WAV, spectrogram)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.100"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
